<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adeliaeXR プレイヤー。没入感の高い360°VR映像や2D映像のコンテンツをシネマティックに再生・プレビューできます。">
  <title>コンテンツプレイヤー | adeliaeXR</title>
  
  <!-- CSS定義のインポート -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- メインアプリケーションロジック -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- ヘッダーロゴ -->
    <header class="app-header">
      <div class="header-left">
        <a href="#" class="logo-text">adeliaeXR</a>
      </div>
      <div class="header-center">
        <img src="images/logo.png" alt="adeliaeXR Logo" class="header-logo-img">
      </div>
      <div class="header-right"></div>
    </header>
    
    <!-- カテゴリ切り替えボタン -->
    <div class="category-filter-bar">
      <button class="filter-btn active" data-category="all">すべて <span class="cat-count">(0)</span></button>
      <button class="filter-btn" data-category="nature">自然 <span class="cat-count">(0)</span></button>
      <button class="filter-btn" data-category="scenery">景色 <span class="cat-count">(0)</span></button>
    </div>

    <!-- リスト一覧ビュー (常にベースに表示) -->
    <main class="main-content" id="listView">
      
      <!-- 自然カテゴリセクション -->
      <section class="movie-category-section" id="section-nature" data-category="nature">
        <div class="category-header">
          <h2 class="category-title">自然</h2>
          <button class="see-all-btn" data-target-category="nature">
            すべてを見る
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <div class="movies-grid">
          
          <!-- サメ映像 -->
          <div class="movie-card" 
               data-title="サメ" 
               data-full-title="海中探訪 - サメ of the deep"
               data-desc="サメが来る！"
               data-image="images/nature_shark.jpg" 
               data-video="images/movies/nature_shark.mp4"
               data-type="Video"
               data-category="自然"
               id="nature-shark">
            <div class="movie-thumbnail-container">
              <video src="images/movies/nature_shark.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge standard">VIDEO</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">サメ</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
          <!-- 恐竜映像 -->
          <div class="movie-card" 
               data-title="恐竜" 
               data-full-title="古代ジャングル - T-Rexの足跡"
               data-desc="恐竜が吠える！恐ろしい古代の王者が目の前に现れます。"
               data-image="images/nature_dinosaur.jpg" 
               data-video="images/movies/nature_dinosaur.mp4"
               data-type="Video"
               data-category="自然"
               id="nature-dinosaur">
            <div class="movie-thumbnail-container">
              <video src="images/movies/nature_dinosaur.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge standard">VIDEO</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">恐竜</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
          <!-- 水田映像 (360度) -->
          <div class="movie-card" 
               data-title="棚田" 
               data-full-title="日本の棚田 - ドローン空撮 360°"
               data-desc="ドローンによる水田空撮。360度見渡す限りのどかな棚田風景が広がります。"
               data-image="images/nature_paddy.jpg" 
               data-video="images/movies/nature_paddy.mp4"
               data-type="360° Video"
               data-category="自然"
               id="nature-paddy">
            <div class="movie-thumbnail-container">
              <video src="images/movies/nature_paddy.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge vr">360° VR</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">棚田</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
          <!-- 深林映像 -->
          <div class="movie-card" 
               data-title="深林" 
               data-full-title="神秘の原生林 - 木漏れ日の散策"
               data-desc="太陽の光が木々をぬけて差し込む静寂で美しき神秘の森。"
               data-image="images/nature_forest.jpg" 
               data-video="images/movies/nature_forest.mp4"
               data-type="Video"
               data-category="自然"
               id="nature-forest">
            <div class="movie-thumbnail-container">
              <video src="images/movies/nature_forest.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge standard">VIDEO</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">深林</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
        </div>
      </section>

      <!-- 景色カテゴリセクション -->
      <section class="movie-category-section" id="section-scenery" data-category="scenery">
        <div class="category-header">
          <h2 class="category-title">景色</h2>
          <button class="see-all-btn" data-target-category="scenery">
            すべてを見る
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>
        <div class="movies-grid">
          
          <!-- ヨット映像 (360度) -->
          <div class="movie-card" 
               data-title="ヨット" 
               data-full-title="極上リゾート - ヨットクルージング 360°"
               data-desc="ヨットの上から眺める美しい海と島々。360度の開放的なパノラマです。"
               data-image="images/scenery_yacht.jpg" 
               data-video="images/movies/scenery_yacht.mp4"
               data-type="360° Video"
               data-category="景色"
               id="scenery-yacht">
            <div class="movie-thumbnail-container">
              <video src="images/movies/scenery_yacht.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge vr">360° VR</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">ヨット</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
          <!-- 滝と虹映像 -->
          <div class="movie-card" 
               data-title="滝" 
               data-full-title="大自然の驚異 - 滝と虹の絶景"
               data-desc="大迫力の滝と、水しぶきの中に架かる鮮やかな虹のコラボレーション。"
               data-image="images/scenery_waterfall.jpg" 
               data-video="images/movies/scenery_waterfall.mp4"
               data-type="Video"
               data-category="景色"
               id="scenery-waterfall">
            <div class="movie-thumbnail-container">
              <video src="images/movies/scenery_waterfall.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge standard">VIDEO</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">滝</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
          <!-- 夕景映像 -->
          <div class="movie-card" 
               data-title="夕景" 
               data-full-title="黄昏の海岸線 - 紫紺の夕焼け"
               data-desc="海岸線を染める紫と黄金のグラデーションの夕焼け。"
               data-image="images/scenery_sunset.jpg" 
               data-video="images/movies/scenery_sunset.mp4"
               data-type="Video"
               data-category="景色"
               id="scenery-sunset">
            <div class="movie-thumbnail-container">
              <video src="images/movies/scenery_sunset.mp4" class="thumbnail-video" muted playsinline></video>
              <div class="video-badge standard">VIDEO</div>
            </div>
            <div class="movie-card-title-bar">
              <span class="movie-card-title">夕景</span>
              <svg class="card-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
            </div>
          </div>
          
        </div>
      </section>
      
    </main>

    <!-- 詳細表示モーダル (初期状態は非表示) -->
    <div class="detail-modal-overlay" id="detailModal" style="display: none;">
      <div class="detail-modal-container" id="detailModalContainer">
        <!-- 上部ヘッダータイトル＆閉じるボタン (distributorモーダルデザイン準拠) -->
        <div class="popup-header">
          <span class="popup-title">動画の詳細</span>
          <button class="vmodal-close-btn popup-close-btn" id="headerCloseBtn" aria-label="閉じる">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        
        <div class="popup-content">
          <div class="detail-grid">
            <!-- 左カラム: プレビュー -->
            <div class="detail-preview-col">
              <div class="cinema-preview">
                <video src="" id="detailVideo" class="thumbnail-video" muted playsinline></video>
              </div>
              
              <!-- 前/次への動画ナビゲーション -->
              <div class="modal-nav-container">
                <button class="modal-nav-btn prev-nav-btn" id="prevMovieBtn">
                  <svg class="nav-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="14 8 8 12 14 16 14 8" fill="currentColor"></polygon></svg>
                  <div class="nav-thumbnail">
                    <img src="" id="prevMovieThumb" alt="前">
                  </div>
                  <div class="nav-info">
                    <span class="nav-label">前へ</span>
                    <span class="nav-title" id="prevMovieTitle">タイトル</span>
                  </div>
                </button>
                <button class="modal-nav-btn next-nav-btn" id="nextMovieBtn">
                  <div class="nav-info">
                    <span class="nav-label">次へ</span>
                    <span class="nav-title" id="nextMovieTitle">タイトル</span>
                  </div>
                  <div class="nav-thumbnail">
                    <img src="" id="nextMovieThumb" alt="次">
                  </div>
                  <svg class="nav-arrow-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon></svg>
                </button>
              </div>
            </div>
            
            <!-- 右カラム: 情報 -->
            <div class="detail-info-col">
              <h1 class="detail-title" id="detailTitleText">タイトル</h1>
              
              <div class="desc-box">
                <p id="detailDescText">説明文</p>
              </div>
              
              <div class="meta-row">
                <span class="meta-item">タイプ：<strong id="detailTypeText">Video</strong></span>
                <span class="meta-item">カテゴリー：<strong id="detailCategoryText">自然</strong></span>
              </div>
              
              <div class="modal-actions-row">
                <button class="modal-close-action-btn" id="backBtn">閉じる</button>
                <button class="play-trigger-btn" id="playTriggerBtn">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                  再生
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- イマーシブ・シアターモーダル (全画面プレイヤー) -->
  <div class="theater-modal" id="theaterModal">
    <!-- 右上閉じるボタン（詳細モーダルと同デザイン） -->
    <button class="vmodal-close-btn popup-close-btn theater-close-top-btn" id="theaterHeaderCloseBtn" aria-label="閉じる">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="theater-layout">
      <!-- 左カラム: プレイヤーと終了ボタン -->
      <div class="theater-left-col">
        <!-- 動画タイトル表示（動画エリア上部） -->
        <div class="theater-video-header">
          <h2 class="theater-video-title" id="theaterVideoTitle">タイトル</h2>
        </div>
        <div class="theater-viewport">
          <div class="theater-screen-bg" id="theaterScreen">
            <video id="theaterVideo" class="theater-video" src="" playsinline></video>
          </div>
          <!-- カスタムビデオコントロール -->
          <div class="theater-video-controls">
            <button class="video-ctrl-btn play-pause-btn" id="theaterPlayPauseBtn">
              <svg class="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg class="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <div class="time-display" id="theaterTimeDisplay">0:00 / 0:00</div>
            <input type="range" class="theater-seek-bar" id="theaterSeekBar" value="0" min="0" max="100" step="0.1">
          </div>
        </div>
        <button class="theater-end-btn" id="closeTheaterBtn">再生を終了</button>
      </div>

      <!-- 右カラム: コントロールパネル -->
      <div class="theater-sidebar">
        <!-- ズーム -->
        <div class="control-panel-box">
          <div class="panel-title">ズーム</div>
          <div class="zoom-buttons">
            <button class="ctrl-btn-rect" id="zoomOutBtn">ー</button>
            <button class="ctrl-btn-rect" id="zoomInBtn">＋</button>
          </div>
        </div>

        <!-- 画面移動 -->
        <div class="control-panel-box">
          <div class="panel-title">画面移動</div>
          <div class="d-pad">
            <button class="dpad-btn up" id="moveUpBtn" aria-label="上移動">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
            <button class="dpad-btn left" id="moveLeftBtn" aria-label="左移動">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <button class="dpad-btn right" id="moveRightBtn" aria-label="右移動">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
            <button class="dpad-btn down" id="moveDownBtn" aria-label="下移動">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            </button>
          </div>
        </div>

        <!-- 視点回転 -->
        <div class="control-panel-box">
          <div class="panel-title">視点回転</div>
          <div class="zoom-buttons">
            <button class="ctrl-btn-rect" id="rotateLeftBtn" aria-label="左回転">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            </button>
            <button class="ctrl-btn-rect" id="rotateRightBtn" aria-label="右回転">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
            </button>
          </div>
        </div>

        <!-- リセット -->
        <div class="control-panel-box">
          <div class="panel-title">リセット</div>
          <button class="ctrl-btn-wide" id="resetViewBtn">初期位置に戻す</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
