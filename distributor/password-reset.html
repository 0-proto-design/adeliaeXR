<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再発行 | adeliaeXR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo">adeliaeXR</span>
        <h1 class="auth-title">パスワード再発行</h1>
      </div>
      
      <p style="color: var(--text-color-secondary); font-size: 14px; text-align: center; margin-bottom: 8px;">
        登録しているメールアドレスを入力してください。<br>パスワード再発行用のリンクをお送りします。
      </p>
      
      <form action="login.html" method="GET" style="display: flex; flex-direction: column; gap: 24px;">
        <div class="auth-form-group">
          <label class="auth-label" for="email">メールアドレス</label>
          <input type="email" id="email" class="auth-input" placeholder="example@adeliaexr.com" required>
        </div>
        
        <button type="submit" class="auth-btn">再発行メールを送信</button>
      </form>
      
      <div class="auth-links">
        <a href="login.html" class="auth-link">ログイン画面へ戻る</a>
      </div>
    </div>
  </div>
</body>
</html>
