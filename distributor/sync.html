<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="コンテンツ管理システム adeliaeXR Distributor の同期設定画面。管理PCに登録されているコンテンツを選択し、現場機器と同期します。">
  <title>配信コンテンツ | adeliaeXR Distributor</title>
  
  <!-- CSS定義のインポート -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 共通Web Components定義のインポート -->
  <script src="js/components/app-header.js" defer></script>
  
  <!-- メインアプリケーションロジック -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- 共通ヘッダーコンポーネント (ページロード時にタイトルを動的に書き換えます) -->
    <app-header active-tab="monitoring" alert-count="1" page-title="1号棟 - 配信コンテンツ" breadcrumbs='[{"name": "設置現場 監視", "url": "index.html"}, {"name": "1号棟 - 詳細 / 設定", "url": "manage.html?id=1"}, {"name": "配信コンテンツ"}]' building-id="1"></app-header>
    
    <!-- メインコンテンツエリア -->
    <main class="main-content">
      <!-- 上部フィルターバー (カテゴリタブ化) -->
      <div class="content-tabs" id="syncCategoryTabs" style="margin-bottom: 24px; width: 100%;">
        <!-- タブボタンは js/app.js から動的に生成されます -->
      </div>

      <!-- 左右スプリットパネル -->
      <div class="sync-panels-wrapper">
        <!-- 左側：管理PC（シアン枠） -->
        <div class="sync-panel panel-pc">
          <div class="panel-header-title" style="margin-bottom: 12px;">全体コンテンツ</div>
          
          <!-- 全選択コントロール行 -->
          <div class="sync-bulk-control" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; height: 60px; box-sizing: border-box; border-bottom: 1px solid rgba(0, 210, 255, 0.1);">
            <label style="margin: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="selectAllMovies" style="cursor: pointer; accent-color: var(--color-cyan); width: 15px; height: 15px; margin: 0;">
              <span style="color: var(--text-color-primary); font-size: 14px; user-select: none;">すべてのコンテンツを選択する</span>
            </label>
            <span id="selectAllMoviesStatus" style="font-size: 12px; color: var(--text-color-secondary);">選択中: 0件</span>
          </div>

          <!-- PC側コンテンツカテゴリコンテナ -->
          <div id="pcMoviesContainer" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- js/app.js から描画されます -->
          </div>
        </div>

        <!-- 右側：号棟側（グリーン枠） -->
        <div class="sync-panel panel-device" id="devicePanel">
          <div class="panel-header-title" id="devicePanelTitle" style="margin-bottom: 12px;">1号棟 配信コンテンツ</div>
          
          <!-- 他の設置現場との同期設定 -->
          <div class="sync-source-control" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; height: 60px; box-sizing: border-box; border-bottom: 1px solid rgba(0, 210, 255, 0.1);">
            <div style="display: flex; align-items: center; gap: 8px; width: 100%;">
              <label style="color: var(--text-color-primary); font-size: 14px; user-select: none; white-space: nowrap;">他の現場の配信コンテンツと同じにする：</label>
              <select class="category-filter-select" id="syncSourceSelect" style="width: auto; flex: 1; max-width: 250px; font-size: 13px; margin: 0; min-width: auto; padding: 10px 40px 10px 16px;">
                <option value="none">-- 自分でコンテンツを選択する --</option>
                <!-- 他の号棟は js/app.js で動的に生成 -->
              </select>
            </div>
          </div>

          <!-- 機器側コンテンツカテゴリコンテナ -->
          <div id="deviceMoviesContainer" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- js/app.js から描画されます -->
          </div>
        </div>
      </div>

      <!-- 下部同期実行・キャンセルボタン -->
      <div class="sync-execute-container" style="display: flex; justify-content: center; gap: 16px;">
        <button class="add-category-btn" id="syncCancelBtn" style="margin: 0; padding: 12px 32px;">キャンセル</button>
        <button class="sync-execute-btn" id="syncExecuteBtn" style="margin: 0; padding: 12px 32px; width: auto; max-width: none; letter-spacing: normal; display: inline-flex; align-items: center; gap: 8px; justify-content: center;">
          選択したコンテンツを反映する
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <!-- 反映中・完了ポップアップ -->
  <div class="sync-progress-modal" id="syncProgressModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; align-items: center; justify-content: center;">
    <!-- 暗幕 -->
    <div class="popup-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 1;"></div>
    <div class="sync-progress-wrapper" style="position: relative; z-index: 2; width: 90%; max-width: 400px; background-color: var(--bg-color-card); border: 1.5px solid var(--color-status-green); border-radius: var(--border-radius-large); padding: 32px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px;">
      
      <style>
        @keyframes syncSpinnerSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .sync-spinner {
          width: 40px;
          height: 40px;
          border: 4px solid rgba(0, 230, 118, 0.15);
          border-top: 4px solid var(--color-status-green);
          border-radius: 50%;
          animation: syncSpinnerSpin 1s linear infinite;
        }
      </style>

      <!-- アイコンエリア -->
      <div id="syncProgressIcon" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
        <div class="sync-spinner"></div>
      </div>

      <!-- テキスト表示 -->
      <div id="syncProgressStatus" style="font-size: 18px; font-weight: bold; color: var(--color-status-green); min-height: 27px;">コンテンツを反映中...</div>
      <div id="syncProgressDesc" style="font-size: 13px; color: var(--text-color-secondary); line-height: 1.5;">
        <span style="white-space: nowrap;">しばらくお待ちください。</span>
      </div>

      <!-- 閉じるボタン (完了時のみ表示) -->
      <button class="btn-status-green" id="syncProgressCloseBtn" style="display: none; width: auto; min-width: 140px; margin: 0;">OK</button>
    </div>
  </div>
</body>
</html>
