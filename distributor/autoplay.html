<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="動画管理システム adeliaeXR Distributor の待機中動画設定画面。">
  <title>待機中動画 | adeliaeXR Distributor</title>
  
  <!-- CSS定義のインポート -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 共通Web Components定義 of インポート -->
  <script src="js/components/app-header.js" defer></script>
  
  <!-- メインアプリケーションロジック -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- 共通ヘッダー -->
    <app-header active-tab="monitoring" alert-count="1" page-title="1号棟 - 待機中動画" breadcrumbs='[{"name": "設置現場 監視", "url": "index.html"}, {"name": "1号棟 - 詳細 / 設定", "url": "manage.html?id=1"}, {"name": "待機中動画"}]' building-id="1"></app-header>
    
    <!-- メインコンテンツ -->
    <main class="main-content">
      <!-- 余白調整のためのスペースのみ残す、または削除 -->

      <!-- 左右2カラムレイアウト -->
      <div class="autoplay-columns-wrapper">
        
        <!-- 左側：自動再生設定 -->
        <div class="autoplay-panel">
          <div class="autoplay-title">自動再生設定</div>

          <!-- 注意文言 -->
          <div class="autoplay-desc">
            操作がない時間が経過すると自動で再生を開始します
          </div>

          <!-- 自動再生スイッチ -->
          <div class="autoplay-setting-item" style="margin-top: 10px; margin-bottom: 8px;">
            <span class="autoplay-setting-label">自動再生</span>
            <div class="toggle-switch-wrapper">
              <div class="toggle-switch on" id="autoplayToggle">
                <div class="toggle-handle"></div>
              </div>
            </div>
          </div>

          <!-- オフ時警告メッセージ -->
          <div id="autoplayDisabledWarning" style="display: none; font-size: 13px; color: var(--color-status-red); font-weight: bold; margin-top: 4px; margin-bottom: 16px; line-height: 1.5;">
            ※現在、自動再生機能はオフです。設定を変更しても自動再生は行われません。
          </div>

          <!-- 待機時間調整 -->
          <div class="autoplay-setting-item" style="border-top: 1px solid rgba(143, 160, 192, 0.1); padding-top: 20px;">
            <span class="autoplay-setting-label">自動再生開始までの時間</span>
            <div class="wait-time-control">
              <div class="wait-time-input-wrapper">
                <input type="text" class="wait-time-input" id="waitTimeInput" value="30">
                <span class="wait-time-unit">分</span>
              </div>
              <div class="spin-buttons">
                <button class="spin-btn" id="spinUpBtn">▲</button>
                <button class="spin-btn" id="spinDownBtn">▼</button>
              </div>
            </div>
          </div>


          <div class="autoplay-setting-item">
            <span class="autoplay-setting-label" style="align-self: flex-start; margin-top: 8px;">プリセット:</span>
            <div class="presets-grid">
              <button class="preset-btn" data-value="10">10分</button>
              <button class="preset-btn active" data-value="30">30分</button>
              <button class="preset-btn" data-value="60">60分</button>
              <button class="preset-btn" data-value="120">120分</button>
            </div>
          </div>

          <!-- ボタンエリア -->
          <div style="display: flex; gap: 12px; margin-top: 24px; border-top: 1px solid rgba(143, 160, 192, 0.1); padding-top: 20px;">
            <button class="add-category-btn" id="backToManageBtn" style="flex: 1; margin: 0; padding: 12px 16px; font-size: 15px; font-weight: bold; background: transparent; border: 1.5px solid var(--color-cyan); color: var(--color-cyan); border-radius: var(--border-radius-medium); cursor: pointer; transition: all 0.2s;">キャンセル</button>
            <button class="new-register-btn" id="saveAutoplayBtn" style="flex: 1; margin: 0; padding: 12px 16px; font-size: 15px; font-weight: bold; border-radius: var(--border-radius-medium); cursor: pointer;">
              設定を保存する
            </button>
          </div>
        </div>

        <!-- 右側：再生動画スロット -->
        <div class="autoplay-panel">
          <div class="autoplay-title" id="slotsPanelTitle">自動再生する動画 （1～5件）</div>
          <div class="autoplay-desc">順番が再生順になります　空のスロットをクリック → 動画を選択</div>

          <div class="slots-container" id="slotsContainer">
            <!-- js/app.js からスロットが動的描画されます -->
          </div>
        </div>
      </div>
    </main>

    <!-- 動画選択モーダル（空スロットクリック時に立ち上がる大型ポップアップ） -->
    <div class="video-select-modal" id="videoSelectModal">
      <!-- 暗幕 -->
      <div class="popup-overlay" id="modalOverlay"></div>
      <div class="video-select-wrapper">
        <!-- ヘッダー: タイトル + 閉じるボタン -->
        <div class="video-select-header">
          <div class="video-select-title" id="modalTitle">動画を選択　（スロット 1 に追加）</div>
          <button class="vmodal-close-btn" id="modalCloseBtn">&times;</button>
        </div>
        <!-- カテゴリタブ -->
        <div class="content-tabs" id="modalCategoryTabs" style="margin: 16px 24px 0 24px; padding-bottom: 4px;">
          <!-- js/app.js から動的生成 -->
        </div>
        <!-- 動画グリッド -->
        <div class="vmodal-grid" id="modalVideoGrid">
          <!-- js/app.js から動的生成 -->
        </div>

      </div>
    </div>

  </div>

  <!-- 保存進捗モーダル (初期非表示) -->
  <div id="saveProgressModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(4px);">
    <div style="background-color: var(--bg-color-card); border: 1.5px solid var(--color-cyan); border-radius: var(--border-radius-large); padding: 40px; display: flex; flex-direction: column; align-items: center; gap: 24px; min-width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0, 210, 255, 0.05);">
      
      <style>
        @keyframes saveSpinnerSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .save-spinner {
          width: 40px;
          height: 40px;
          border: 4px solid rgba(0, 210, 255, 0.15);
          border-top: 4px solid var(--color-cyan);
          border-radius: 50%;
          animation: saveSpinnerSpin 1s linear infinite;
        }
      </style>

      <!-- アイコンエリア -->
      <div id="saveProgressIcon" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
        <div class="save-spinner"></div>
      </div>

      <!-- テキスト表示 -->
      <div id="saveProgressStatus" style="font-size: 18px; font-weight: bold; color: var(--color-cyan); min-height: 27px;">設定を保存中...</div>
      <div id="saveProgressDesc" style="font-size: 13px; color: var(--text-color-secondary); line-height: 1.5;">
        <span style="white-space: nowrap;">しばらくお待ちください。</span>
      </div>

      <!-- 閉じるボタン (完了時のみ表示) -->
      <button class="new-register-btn" id="saveProgressCloseBtn" style="display: none; width: auto; min-width: 140px; padding: 10px 32px; margin: 0; font-size: 15px; font-weight: bold; border-radius: var(--border-radius-medium); cursor: pointer;">OK</button>
    </div>
  </div>
</body>
</html>
