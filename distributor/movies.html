<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="動画管理システム adeliaeXR Distributor の全体動画管理画面。上映する動画の登録・編集・カテゴリ管理を行えます。">
  <title>動画マスター管理 | adeliaeXR Distributor</title>
  
  <!-- CSS定義のインポート -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 共通Web Components定義のインポート -->
  <script src="js/components/app-header.js" defer></script>
  <script src="js/components/category-popup.js" defer></script>
  <script src="js/components/register-popup.js" defer></script>
  <script src="js/components/movie-detail-popup.js" defer></script>
  
  <!-- メインアプリケーションロジック -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- 共通ヘッダーコンポーネント (アクティブタブ: contents (全体動画管理), アラートカウント: 1, ページタイトル: 全体動画管理) -->
    <app-header active-tab="contents" alert-count="1" page-title="動画マスター管理"></app-header>
    
    <!-- メインコンテンツエリア -->
    <main class="main-content">
      <!-- ページ上部アクション -->
      <div class="action-bar">
        <button class="add-category-btn" id="addCategoryBtn">カテゴリ編集</button>
        <button class="new-register-btn" id="newRegisterBtn">＋ 動画を追加</button>
      </div>

      <!-- カテゴリと動画の一覧は js/app.js から動的にレンダリングされます -->
    </main>
    
    <!-- カテゴリ管理ポップアップコンポーネント -->
    <category-popup></category-popup>

    <!-- 動画新規登録ポップアップコンポーネント -->
    <register-popup></register-popup>

    <!-- 動画編集・詳細ポップアップコンポーネント -->
    <movie-detail-popup></movie-detail-popup>
  </div>
</body>
</html>
