<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="コンテンツ管理システム adeliaeXR Distributor の詳細管理専用画面。各号棟の上映プレイリストおよび配信設定を行います。">
  <title>詳細管理 | adeliaeXR Distributor</title>
  
  <!-- CSS定義のインポート -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 共通Web Components定義のインポート -->
  <script src="js/components/app-header.js" defer></script>
  
  <!-- メインアプリケーションロジック -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-container">
    <!-- 共通ヘッダーコンポーネント (ページロード時にタイトルを動的に書き換えます) -->
    <app-header id="appHeader" active-tab="monitoring" alert-count="1" page-title="1号棟 - 詳細 / 設定" breadcrumbs='[{"name": "設置現場 監視", "url": "index.html"}, {"name": "1号棟 - 詳細 / 設定"}]' building-id="1"></app-header>
    
    <!-- メインコンテンツエリア -->
    <main class="main-content">
      <!-- 上部設定バー (提示画像の再現) -->
      <div class="config-bar">
        <!-- 左側設定項目群 -->
        <div class="config-left">
          <!-- 現場名編集 -->
          <div class="config-item">
            <span class="config-label">現場名：</span>
            <span class="config-building-name-display" id="buildingNameDisplay" style="font-weight: bold; color: #ffffff; margin-right: 8px;">1号棟</span>
            <button class="add-category-btn" id="editBuildingNameBtn" style="padding: 6px 12px; margin: 0; font-size: 14px;">編集</button>
          </div>
          
          
          <!-- ロゴ設定 -->
          <div class="config-item">
            <span class="config-label">ロゴ：</span>
            <div class="config-logo-preview">ロゴ</div>
            <button class="add-category-btn" id="logoSelectBtn" style="padding: 6px 16px; margin: 0; font-size: 15px;">変更</button>
          </div>

          <!-- 背景色設定 -->
          <div class="config-item">
            <span class="config-label">テーマカラー：</span>
            <div class="config-color-picker" id="colorPickerBtn" title="背景色を選択"></div>
          </div>
        </div>

        <!-- 右側アクションボタン群 (シアンソリッド ＋ ダークネイビー文字) -->
        <div class="config-right">
          <button class="new-register-btn" id="syncBtn" style="padding: 8px 24px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
            配信コンテンツを設定
            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" style="display: block;">
              <polygon points="6 2 18 12 6 22"/>
            </svg>
          </button>
          <button class="new-register-btn" id="autoPlayBtn" style="padding: 8px 24px; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
            待機時表示コンテンツを設定
            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor" style="display: block;">
              <polygon points="6 2 18 12 6 22"/>
            </svg>
          </button>
        </div>
      </div>



      <!-- コンテンツ選択グリッドは js/app.js から動的にレンダリングされます -->
    </main>

    <!-- 現場名編集モーダル -->
    <div class="video-select-modal" id="buildingNameModal" style="display: none;">
      <div class="popup-overlay" id="nameModalOverlay"></div>
      <div class="video-select-wrapper" style="max-width: 480px; height: auto;">
        <div class="video-select-header">
          <div class="video-select-title">設置現場名の編集</div>
          <button class="vmodal-close-btn" id="nameModalCloseBtn">&times;</button>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" id="newBuildingNameInput" style="width: 100%; padding: 10px 14px; background-color: var(--bg-color-main); border: 1.5px solid var(--color-cyan); border-radius: var(--border-radius-small); color: var(--text-color-primary); font-size: 15px; box-sizing: border-box;" placeholder="現場名を入力してください">
          </div>
        </div>
        <div class="vmodal-footer" style="justify-content: center;">
          <div style="display: flex; gap: 8px;">
            <button class="add-category-btn vmodal-cancel-btn" id="nameModalCancelBtn" style="padding: 8px 16px; font-size: 14px;">キャンセル</button>
            <button class="new-register-btn" id="saveBuildingNameBtn" style="padding: 8px 24px; font-size: 14px;">保存する</button>
          </div>
        </div>
      </div>
    </div>
    </div>

    <!-- ロゴ変更モーダル -->
    <div class="video-select-modal" id="logoChangeModal" style="display: none;">
      <div class="popup-overlay" id="logoModalOverlay"></div>
      <div class="video-select-wrapper" style="max-width: 480px; height: auto;">
        <div class="video-select-header">
          <div class="video-select-title">ロゴの変更</div>
          <button class="vmodal-close-btn" id="logoModalCloseBtn">&times;</button>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 24px;">
          
          <div class="thumbnail-upload-box" id="logoUploadBox" style="width: 100%;">
            <!-- 未設定時の表示 -->
            <div class="upload-placeholder" id="logoUploadPlaceholder">
              <div class="upload-placeholder-title">ロゴ画像</div>
              <div class="upload-placeholder-text" style="flex-direction: column; gap: 8px;">
                <span>ファイルをドラッグ＆ドロップしてください</span>
                <div class="upload-placeholder-action">
                  <span class="or-text">または</span>
                  <button class="inline-file-select-btn" id="logoUploadBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    画像を選択
                  </button>
                </div>
              </div>
            </div>

            <!-- 画像反映時の表示 -->
            <div class="thumbnail-preview-container" id="logoPreviewContainer" style="display: none;">
              <div class="thumbnail-badge">ロゴ画像</div>
              <img id="logoModalThumbnailImg" src="" alt="ロゴ" class="thumbnail-img" style="object-fit: contain;">
              <div style="position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 2;">
                <button class="btn-change-image" id="logoRemoveBtn" style="position: static; background-color: #2b0d0d; border-color: rgba(255, 77, 77, 0.5); color: var(--color-status-red);">
                  クリア
                </button>
                <button class="btn-change-image" id="logoChangeImageBtn" style="position: static;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                  </svg>
                  画像を変更
                </button>
              </div>
            </div>

            <input type="file" id="logoUploadInput" accept="image/*" style="display: none;">
          </div>

        </div>
        <div class="vmodal-footer" style="justify-content: center;">
          <div style="display: flex; gap: 8px;">
            <button class="add-category-btn vmodal-cancel-btn" id="logoModalCancelBtn" style="padding: 8px 16px; font-size: 14px;">キャンセル</button>
            <button class="new-register-btn" id="saveLogoBtn" style="padding: 8px 24px; font-size: 14px;">保存する</button>
          </div>
        </div>
      </div>
    </div>

    <!-- テーマカラー変更モーダル -->
    <div class="video-select-modal" id="themeColorModal" style="display: none;">
      <div class="popup-overlay" id="colorModalOverlay"></div>
      <div class="video-select-wrapper" style="max-width: 400px; height: auto;">
        <div class="video-select-header">
          <div class="video-select-title">テーマカラーの変更</div>
          <button class="vmodal-close-btn" id="colorModalCloseBtn">&times;</button>
        </div>
        <div style="padding: 24px; display: flex; flex-direction: column; gap: 24px;">
          
          <!-- プリセットカラーグリッド -->
          <div class="color-preset-grid" id="colorPresetGrid">
            <button class="color-preset-btn selected" style="background-color: #00d2ff;" data-color="#00d2ff" title="ブルー"></button>
            <button class="color-preset-btn" style="background-color: #4caf50;" data-color="#4caf50" title="グリーン"></button>
            <button class="color-preset-btn" style="background-color: #f44336;" data-color="#f44336" title="レッド"></button>
            <button class="color-preset-btn" style="background-color: #ff9800;" data-color="#ff9800" title="オレンジ"></button>
            <button class="color-preset-btn" style="background-color: #9c27b0;" data-color="#9c27b0" title="パープル"></button>
            <button class="color-preset-btn" style="background-color: #e91e63;" data-color="#e91e63" title="ピンク"></button>
            <button class="color-preset-btn" style="background-color: #9e9e9e;" data-color="#9e9e9e" title="グレー"></button>
            <button class="color-preset-btn light-color" style="background-color: #ffffff; border: 1px solid #ddd;" data-color="#ffffff" title="ホワイト"></button>
          </div>

          <!-- カスタム色 -->
          <div style="text-align: center; margin-top: -8px;">
            <div style="font-size: 14px; color: var(--text-color-secondary); margin-bottom: 12px;">カスタムカラー</div>
            <div style="display: flex; justify-content: center;">
              <button class="color-preset-btn" id="customColorPresetBtn" style="background-color: #333333;" title="カスタムカラー">
                <input type="color" id="customColorInput" value="#333333" style="opacity: 0; position: absolute; width: 100%; height: 100%; left: 0; top: 0; cursor: pointer; padding: 0; border: none;">
              </button>
            </div>
          </div>
          
        </div>
        <div class="vmodal-footer" style="justify-content: center;">
          <div style="display: flex; gap: 8px;">
            <button class="add-category-btn vmodal-cancel-btn" id="colorModalCancelBtn" style="padding: 8px 16px; font-size: 14px;">キャンセル</button>
            <button class="new-register-btn" id="saveColorBtn" style="padding: 8px 24px; font-size: 14px;">保存する</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
